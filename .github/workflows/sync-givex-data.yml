name: Sync Givex sales data from webhook KV

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes -- matches the Excel sync cadence
  workflow_dispatch:
    inputs:
      full_resync:
        description: "Ignore saved state and rebuild all data from scratch (use after a store-mapping.json or department classification change)"
        type: boolean
        default: false

# Prevent a scheduled run from racing a long-running manual full resync (or
# another scheduled run that's still going). Without this, two runs can both
# check out main, both compute results, and the second git push gets rejected
# as non-fast-forward -- which is exactly what happened on 2026-08-18 when a
# ~21-minute full resync collided with the next 15-minute scheduled run.
# cancel-in-progress: false means overlapping runs QUEUE instead of one
# cancelling the other, so no sync attempt is silently dropped.
concurrency:
  group: sync-givex-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull latest orders from the Givex webhook Worker and aggregate
        env:
          GIVEX_WEBHOOK_URL: ${{ secrets.GIVEX_WEBHOOK_URL }}
          GIVEX_SHARED_SECRET: ${{ secrets.GIVEX_SHARED_SECRET }}
          FULL_RESYNC: ${{ github.event.inputs.full_resync }}
        run: node scripts/sync-givex-to-json.mjs

      - name: Commit changes if data updated
        run: |
          git config user.name "mezza-scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/givex-sales-data.json data/givex-sync-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync Givex sales data ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git pull --rebase origin main
            git push
          fi
