name: Sync labour and lead data

# Both of these move on a scale of days, not minutes, so once a day is
# the right cadence. They are in one workflow because they are one
# question -- how well is the business being run, and is it growing --
# and because a labour API that is currently blocked should not have
# its own permanently-red workflow on the Actions tab.

on:
  schedule:
    - cron: "40 11 * * *"   # ~08:40 Atlantic, after the Google sync
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-growth-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # continue-on-error on both: these are independent sources and a
      # missing secret on one must not stop the other. Each script
      # writes its own status into its own file, so a failure is
      # visible in the data rather than only in a build log.
      - name: Unit tests
        run: |
          mkdir -p /tmp/ptest && cd /tmp/ptest
          cp "$GITHUB_WORKSPACE/scripts/sync-push-labour.mjs" push.mjs
          cp "$GITHUB_WORKSPACE/scripts/test-push.mjs" test-push.mjs
          node test-push.mjs

      # A missing secret writes a status file rather than only echoing
      # into a log. Skipping quietly made this workflow report success
      # while doing nothing at all, and nothing downstream could tell
      # "labour is not configured" from "labour has not been looked at".
      # Actions logs are not readable from where this gets debugged, so
      # the state has to land in the data.
      - name: Push Operations labour
        id: push
        continue-on-error: true
        env:
          PUSH_BEARER_TOKEN: ${{ secrets.PUSH_BEARER_TOKEN }}
        run: |
          if [ -z "$PUSH_BEARER_TOKEN" ]; then
            mkdir -p data
            cat > data/push-labour-data.json <<'JSON'
          {
           "source": "push-operations",
           "status": "not_configured",
           "status_detail": "PUSH_BEARER_TOKEN is not set as a repository secret, so no labour call was attempted. This is not a reading of zero labour. Settings -> Secrets and variables -> Actions -> New repository secret, name PUSH_BEARER_TOKEN, then re-run 'Sync labour and lead data'. Push (Christian) enabled the department endpoint on 2026-09-03, so the entitlement side is done.",
           "days": []
          }
          JSON
            node -e "const f='data/push-labour-data.json';const d=require('./'+f);d.generated_at=new Date().toISOString();require('fs').writeFileSync(f,JSON.stringify(d,null,1)+'\n')"
            echo "PUSH_BEARER_TOKEN not set — wrote status=not_configured and skipped."
            exit 0
          fi
          node scripts/sync-push-labour.mjs

      - name: HubSpot leads
        id: hubspot
        continue-on-error: true
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          if [ -z "$HUBSPOT_TOKEN" ]; then
            mkdir -p data
            cat > data/hubspot-data.json <<'JSON'
          {
           "source": "hubspot",
           "status": "not_configured",
           "status_detail": "HUBSPOT_TOKEN is not set as a repository secret, so no lead call was attempted. This is not a reading of zero leads. Settings -> Secrets and variables -> Actions -> New repository secret, name HUBSPOT_TOKEN, then re-run 'Sync labour and lead data'."
          }
          JSON
            node -e "const f='data/hubspot-data.json';const d=require('./'+f);d.generated_at=new Date().toISOString();require('fs').writeFileSync(f,JSON.stringify(d,null,1)+'\n')"
            echo "HUBSPOT_TOKEN not set — wrote status=not_configured and skipped."
            exit 0
          fi
          node scripts/sync-hubspot-to-json.mjs

      - name: Commit whatever updated
        if: always()
        run: |
          git config user.name "mezza-scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/push-labour-data.json data/hubspot-data.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync labour and lead data ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git pull --rebase origin main
            git push
          fi
