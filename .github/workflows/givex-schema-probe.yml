name: Givex payload schema probe

# Manual diagnostic. Run this before changing which fields the sales
# sync reads, and any time Givex says they have changed their payload.
# Emits keys and types only -- see scripts/givex-schema-probe.mjs for
# the privacy rules it holds to.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-givex-data
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Probe stored payload structure
        env:
          GIVEX_WEBHOOK_URL: ${{ secrets.GIVEX_WEBHOOK_URL }}
          GIVEX_SHARED_SECRET: ${{ secrets.GIVEX_SHARED_SECRET }}
        run: node scripts/givex-schema-probe.mjs
      - name: Commit probe output
        run: |
          git config user.name "mezza-scorecard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/givex-schema-probe.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Givex payload schema probe ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git pull --rebase origin main
            git push
          fi
