name = "mezza-sync-cron"
main = "worker.js"
compatibility_date = "2026-08-01"

# Every 15 minutes. Unlike GitHub's scheduler, Cloudflare Cron Triggers
# are not best-effort -- they fire. And because this checks the feed's
# age before dispatching, a healthy pipeline costs one cheap API read
# per tick rather than a workflow run.
[triggers]
crons = ["*/15 * * * *"]

# Secrets are NOT set here. Set them in the dashboard as encrypted
# variables, the same way GIVEX_SHARED_SECRET is set on the webhook
# Worker:
#   GITHUB_TOKEN         fine-grained PAT: Actions read/write,
#                        Contents read, on peternahas/mezza-scorecard only
#   CRON_SHARED_SECRET   any random string; guards GET / so nobody else
#                        can trigger dispatches
